<style>
:root{--bg:#070707;--panel:#121110;--line:#2b2417;--gold:#d4af37;--gold2:#f1d78a;--txt:#f3ecdc;--mut:#a89f8c}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font-family:'Cairo',Tahoma,sans-serif;line-height:1.7}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:rgba(7,7,7,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-weight:900;font-size:28px;color:var(--gold);letter-spacing:.5px}
.wa{background:var(--gold);color:#111;font-weight:800;padding:8px 18px;border-radius:4px;font-size:15px}
.wa:hover{background:var(--gold2)}
.hero{position:relative;min-height:84vh;display:flex;align-items:flex-end;overflow:hidden;border-bottom:1px solid var(--line)}
.hero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.5}
.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(to top,var(--bg) 8%,rgba(7,7,7,.2) 70%)}
.hero .wrap{position:relative;z-index:2;padding-bottom:56px}
.hero h1{font-size:clamp(46px,10vw,104px);font-weight:900;line-height:1.1;color:var(--gold)}
.hero p{font-size:clamp(18px,3vw,26px);max-width:520px;margin:12px 0 26px}
.btn{display:inline-block;border:2px solid var(--gold);color:var(--gold);font-weight:800;padding:11px 28px;border-radius:4px}
.btn:hover{background:var(--gold);color:#111}
.btn.fill{background:var(--gold);color:#111;margin-inline-start:10px}
section{padding:64px 0}
h2{font-size:clamp(28px,5vw,40px);font-weight:900;color:var(--gold);margin-bottom:22px}
.tabs{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:28px}
.tab{font:inherit;font-weight:600;background:none;color:var(--txt);border:1px solid var(--line);padding:7px 18px;border-radius:40px;cursor:pointer}
.tab.on,.tab:hover{background:var(--gold);color:#111;border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:20px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;overflow:hidden;display:flex;flex-direction:column}
.card.hide{display:none}
.ph{display:block;border:0;background:#000;cursor:zoom-in;aspect-ratio:3/4;overflow:hidden;width:100%}
.ph img{width:100%;height:100%;object-fit:cover;transition:transform .5s}
.ph:hover img{transform:scale(1.05)}
.info{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px}
.info h3{font-size:17px;font-weight:600}
.ask{align-self:flex-start;border:1px solid var(--gold);color:var(--gold);padding:5px 16px;border-radius:4px;font-weight:600;font-size:14px}
.ask:hover{background:var(--gold);color:#111}
.why{border-block:1px solid var(--line);background:var(--panel)}
.why ul{list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:26px}
.why strong{display:block;color:var(--gold);font-size:20px}
.why span{color:var(--mut)}
.contact{display:grid;gap:18px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.contact div{border-inline-start:3px solid var(--gold);padding:4px 16px}
.contact small{color:var(--mut);display:block}
.contact b{font-size:20px;direction:ltr;unicode-bidi:plaintext}
footer{text-align:center;color:var(--mut);padding:26px;border-top:1px solid var(--line);font-size:14px}
.fab{position:fixed;bottom:18px;left:18px;z-index:30;background:#25d366;color:#fff;font-weight:800;padding:12px 20px;border-radius:40px;box-shadow:0 4px 18px rgba(0,0,0,.5)}
.lb{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;padding:20px}
.lb.on{display:flex}
.lb img{max-width:100%;max-height:92vh;border:1px solid var(--gold)}
.lb button{position:absolute;top:14px;right:18px;font-size:36px;background:none;border:0;color:var(--gold);cursor:pointer}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media(max-width:520px){.grid{grid-template-columns:repeat(2,1fr);gap:12px}.info h3{font-size:14px}.ask{font-size:12px;padding:4px 10px}.btn.fill{margin:10px 0 0}}
</style>
